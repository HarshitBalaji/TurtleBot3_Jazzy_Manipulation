controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: parallel_gripper_action_controller/GripperActionController
    
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    state_publish_rate: 50.0
    action_monitor_rate: 20.0

gripper_controller:
  ros__parameters:
    joint: gripper_left_joint

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    action_monitor_rate: 20.0

diff_drive_controller:
  ros__parameters:
    left_wheel_names:
      - wheel_left_joint

    right_wheel_names:
      - wheel_right_joint

    wheel_separation: 0.288
    wheel_radius: 0.033

    publish_rate: 50.0
    base_frame_id: base_link
    odom_frame_id: odom

    use_stamped_vel: true
